[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add markers
markers =
    unit: Unit tests
    integration: Integration tests
    performance: Performance tests
    slow: Slow running tests
    redis: Tests requiring Redis

# Coverage configuration
addopts = --cov=src --cov=tests --cov-report=term-missing --cov-report=html:htmlcov --cov-report=xml:coverage.xml --cov-fail-under=80 --strict-markers --disable-warnings --tb=short

# Minimum test version
minversion = 6.0

# Test discovery patterns
collect_ignore = venv vector_db documents Uploads

# Async test support
asyncio_mode = auto
